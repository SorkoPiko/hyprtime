version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: hyprtimed
    main: ./cmd/hyprtimed
    binary: hyprtimed
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64

  - id: hyprtime
    main: ./cmd/hyprtime
    binary: hyprtime
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64

archives:
  - formats: [tar.xz]

    name_template: "{{ .ProjectName }}_{{ .Version }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
